<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1860 920" width="1860" height="920">
  <defs>
    <style>
      .caption { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 32px; font-weight: 700; fill: #1E293B; text-anchor: middle; }
      .app-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 26px; font-weight: 700; fill: #1F3F24; text-anchor: middle; }
      .os-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 24px; font-weight: 700; fill: #133D4F; text-anchor: middle; }
      .hyp-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 20px; font-weight: 700; fill: #0891B2; text-anchor: middle; }
      .host-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 26px; font-weight: 700; fill: #1E293B; text-anchor: middle; }
      .host-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 16px; font-weight: 600; fill: #475569; text-anchor: middle; }
      .small-app { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 22px; font-weight: 700; fill: #1F3F24; text-anchor: middle; }
      .small-os { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 22px; font-weight: 700; fill: #133D4F; text-anchor: middle; }
      .vm-badge { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 16px; font-weight: 700; fill: #0369A1; text-anchor: middle; }
      .vm-group-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 19px; font-weight: 700; fill: #0369A1; text-anchor: middle; }
      .bracket-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 21px; font-weight: 700; fill: #047857; text-anchor: start; }
      .bracket-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 15px; font-weight: 600; fill: #64748B; text-anchor: start; }
    </style>
  </defs>

  <!-- ==================== LEFT: TRADITIONAL ARCHITECTURE ==================== -->
  <g>
    <!-- Application Box -->
    <rect x="80" y="80" width="710" height="175" rx="8" ry="8" fill="#D3EFD6" stroke="#9FD4A8" stroke-width="2.5"/>
    <text x="435" y="177" class="app-text">APPLICATION</text>

    <!-- Operating System Box -->
    <rect x="80" y="275" width="710" height="175" rx="8" ry="8" fill="#D4EFF7" stroke="#99D9E8" stroke-width="2.5"/>
    <text x="435" y="372" class="os-text">OPERATING SYSTEM</text>

    <!-- Server Chassis / Hardware -->
    <rect x="80" y="470" width="710" height="270" rx="10" ry="10" fill="#CAD7EE" stroke="#9BB2D8" stroke-width="2.5"/>
    
    <!-- Chassis details: LED Circle on left -->
    <circle cx="160" cy="605" r="24" fill="#FFFFFF" stroke="#CAD7EE" stroke-width="1.5"/>
    
    <!-- Hardware text label -->
    <text x="435" y="605" class="host-text">HARDWARE</text>
    <text x="435" y="632" class="host-sub">(Physical Server)</text>

    <!-- Chassis details: 3 Ventilation slits on right -->
    <rect x="620" y="535" width="22" height="140" rx="11" ry="11" fill="#FFFFFF" stroke="none"/>
    <rect x="660" y="535" width="22" height="140" rx="11" ry="11" fill="#FFFFFF" stroke="none"/>
    <rect x="700" y="535" width="22" height="140" rx="11" ry="11" fill="#FFFFFF" stroke="none"/>
  </g>

  <!-- Left Caption -->
  <text x="435" y="810" class="caption">Traditional architecture</text>


  <!-- ==================== RIGHT: VIRTUAL ARCHITECTURE ==================== -->
  <g>
    <!-- Overall VM Group Header / Label -->
    <text x="1275" y="45" class="vm-group-title">VIRTUAL MACHINES (VMs)</text>

    <!-- VM 1 (Left) -->
    <rect x="920" y="60" width="224" height="195" rx="8" ry="8" fill="#F8FAFC" stroke="#60A5FA" stroke-width="1.8" stroke-dasharray="4,3"/>
    <text x="1032" y="83" class="vm-badge">VM 1</text>
    
    <rect x="928" y="94" width="208" height="74" rx="6" ry="6" fill="#D3EFD6" stroke="#9FD4A8" stroke-width="2"/>
    <text x="1032" y="139" class="small-app">APP</text>
    
    <rect x="928" y="174" width="208" height="74" rx="6" ry="6" fill="#D4EFF7" stroke="#99D9E8" stroke-width="2"/>
    <text x="1032" y="219" class="small-os">OS</text>

    <!-- VM 2 (Middle) -->
    <rect x="1163" y="60" width="224" height="195" rx="8" ry="8" fill="#F8FAFC" stroke="#60A5FA" stroke-width="1.8" stroke-dasharray="4,3"/>
    <text x="1275" y="83" class="vm-badge">VM 2</text>
    
    <rect x="1171" y="94" width="208" height="74" rx="6" ry="6" fill="#D3EFD6" stroke="#9FD4A8" stroke-width="2"/>
    <text x="1275" y="139" class="small-app">APP</text>
    
    <rect x="1171" y="174" width="208" height="74" rx="6" ry="6" fill="#D4EFF7" stroke="#99D9E8" stroke-width="2"/>
    <text x="1275" y="219" class="small-os">OS</text>

    <!-- VM 3 (Right) -->
    <rect x="1406" y="60" width="224" height="195" rx="8" ry="8" fill="#F8FAFC" stroke="#60A5FA" stroke-width="1.8" stroke-dasharray="4,3"/>
    <text x="1518" y="83" class="vm-badge">VM 3</text>
    
    <rect x="1414" y="94" width="208" height="74" rx="6" ry="6" fill="#D3EFD6" stroke="#9FD4A8" stroke-width="2"/>
    <text x="1518" y="139" class="small-app">APP</text>
    
    <rect x="1414" y="174" width="208" height="74" rx="6" ry="6" fill="#D4EFF7" stroke="#99D9E8" stroke-width="2"/>
    <text x="1518" y="219" class="small-os">OS</text>

    <!-- Side Bracket for GUEST -->
    <path d="M 1642 96 Q 1654 96 1654 116 L 1654 161 Q 1654 171 1664 171 Q 1654 171 1654 181 L 1654 228 Q 1654 248 1642 248" fill="none" stroke="#059669" stroke-width="2.5"/>
    <text x="1676" y="166" class="bracket-text">GUEST</text>
    <text x="1676" y="188" class="bracket-sub">(OS &amp; Apps)</text>

    <!-- Virtualization Layer / Hypervisor Box -->
    <rect x="920" y="275" width="710" height="175" rx="8" ry="8" fill="#D4EFF7" stroke="#99D9E8" stroke-width="2.5"/>
    <text x="1275" y="352" class="os-text">VIRTUALIZATION LAYER</text>
    <text x="1275" y="386" class="hyp-sub">HYPERVISOR (VMM)</text>

    <!-- Server Chassis / Host Hardware -->
    <rect x="920" y="470" width="710" height="270" rx="10" ry="10" fill="#CAD7EE" stroke="#9BB2D8" stroke-width="2.5"/>
    
    <!-- Chassis details: Circular LED button -->
    <circle cx="1000" cy="605" r="24" fill="#FFFFFF" stroke="#CAD7EE" stroke-width="1.5"/>
    
    <!-- Host text label -->
    <text x="1275" y="598" class="host-text">HOST</text>
    <text x="1275" y="626" class="host-sub">(Physical Hardware)</text>

    <!-- Chassis details: 3 Ventilation slits -->
    <rect x="1460" y="535" width="22" height="140" rx="11" ry="11" fill="#FFFFFF" stroke="none"/>
    <rect x="1500" y="535" width="22" height="140" rx="11" ry="11" fill="#FFFFFF" stroke="none"/>
    <rect x="1540" y="535" width="22" height="140" rx="11" ry="11" fill="#FFFFFF" stroke="none"/>
  </g>

  <!-- Right Caption -->
  <text x="1275" y="810" class="caption">Virtual architecture</text>
</svg>
