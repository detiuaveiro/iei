<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1860 960" width="1860" height="960">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 36px; font-weight: 700; fill: #0F172A; text-anchor: middle; }
      .box-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 26px; font-weight: 700; text-anchor: middle; }
      .box-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 18px; font-weight: 600; text-anchor: middle; }
      .badge { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 18px; font-weight: 700; fill: #0369A1; text-anchor: middle; }
    </style>
  </defs>

  <rect width="1860" height="960" fill="#FFFFFF"/>

  <!-- ==================== LEFT: VIRTUAL MACHINES ==================== -->
  <g transform="translate(60, 40)">
    <text x="400" y="52" class="title">Máquinas Virtuais (VMs)</text>

    <!-- VM 1 -->
    <rect x="20" y="100" width="230" height="110" rx="8" fill="#D3EFD6" stroke="#86EFAC" stroke-width="2"/>
    <text x="135" y="145" class="box-title" fill="#14532D">Aplicação A</text>
    <text x="135" y="175" class="box-sub" fill="#166534">Bibliotecas / Binários</text>
    <rect x="20" y="220" width="230" height="140" rx="8" fill="#E0F2FE" stroke="#7DD3FC" stroke-width="2"/>
    <text x="135" y="275" class="box-title" fill="#0369A1">SO Convidado</text>
    <text x="135" y="310" class="box-sub" fill="#0284C7" font-size="19px">(Kernel Próprio)</text>
    <rect x="20" y="90" width="230" height="280" rx="10" fill="none" stroke="#0284C7" stroke-dasharray="6,4" stroke-width="2"/>
    <text x="135" y="78" class="badge">VM 1</text>

    <!-- VM 2 -->
    <rect x="285" y="100" width="230" height="110" rx="8" fill="#D3EFD6" stroke="#86EFAC" stroke-width="2"/>
    <text x="400" y="145" class="box-title" fill="#14532D">Aplicação B</text>
    <text x="400" y="175" class="box-sub" fill="#166534">Bibliotecas / Binários</text>
    <rect x="285" y="220" width="230" height="140" rx="8" fill="#E0F2FE" stroke="#7DD3FC" stroke-width="2"/>
    <text x="400" y="275" class="box-title" fill="#0369A1">SO Convidado</text>
    <text x="400" y="310" class="box-sub" fill="#0284C7" font-size="19px">(Kernel Próprio)</text>
    <rect x="285" y="90" width="230" height="280" rx="10" fill="none" stroke="#0284C7" stroke-dasharray="6,4" stroke-width="2"/>
    <text x="400" y="78" class="badge">VM 2</text>

    <!-- VM 3 -->
    <rect x="550" y="100" width="230" height="110" rx="8" fill="#D3EFD6" stroke="#86EFAC" stroke-width="2"/>
    <text x="665" y="145" class="box-title" fill="#14532D">Aplicação C</text>
    <text x="665" y="175" class="box-sub" fill="#166534">Bibliotecas / Binários</text>
    <rect x="550" y="220" width="230" height="140" rx="8" fill="#E0F2FE" stroke="#7DD3FC" stroke-width="2"/>
    <text x="665" y="275" class="box-title" fill="#0369A1">SO Convidado</text>
    <text x="665" y="310" class="box-sub" fill="#0284C7" font-size="19px">(Kernel Próprio)</text>
    <rect x="550" y="90" width="230" height="280" rx="10" fill="none" stroke="#0284C7" stroke-dasharray="6,4" stroke-width="2"/>
    <text x="665" y="78" class="badge">VM 3</text>

    <!-- Hypervisor -->
    <rect x="20" y="400" width="760" height="170" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="2.5"/>
    <text x="400" y="475" class="box-title" fill="#92400E" font-size="30px">HIPERVISOR (VMM)</text>
    <text x="400" y="515" class="box-sub" fill="#B45309" font-size="19px">Tipo-1 (Bare-Metal) ou Tipo-2 sobre SO Anfitrião (KVM, VirtualBox)</text>

    <!-- Host Hardware -->
    <rect x="20" y="600" width="760" height="230" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2.5"/>
    <text x="400" y="695" class="box-title" fill="#1E293B" font-size="30px">INFRAESTRUTURA FÍSICA (ANFITRIÃO / HOST)</text>
    <text x="400" y="740" class="box-sub" fill="#475569" font-size="20px">CPU (x86_64, ARM) · Memória RAM · Discos de Armazenamento · Placas de Rede</text>
  </g>

  <!-- Divider Line -->
  <line x1="930" y1="40" x2="930" y2="900" stroke="#E2E8F0" stroke-width="3" stroke-dasharray="10,6"/>

  <!-- ==================== RIGHT: CONTAINERS ==================== -->
  <g transform="translate(990, 40)">
    <text x="400" y="52" class="title">Contentores (Docker)</text>

    <!-- Container 1 -->
    <rect x="20" y="100" width="230" height="260" rx="8" fill="#D3EFD6" stroke="#86EFAC" stroke-width="2"/>
    <text x="135" y="155" class="box-title" fill="#14532D">Aplicação A</text>
    <text x="135" y="188" class="box-sub" fill="#166534">Bibliotecas / Deps</text>
    <rect x="35" y="225" width="200" height="115" rx="6" fill="#BBF7D0" stroke="#86EFAC" stroke-width="1.5"/>
    <text x="135" y="270" class="box-sub" fill="#14532D" font-size="19px" font-weight="700">Sistema Ficheiros</text>
    <text x="135" y="300" class="box-sub" fill="#166534" font-size="16px">(ex: Alpine rootfs)</text>
    <rect x="20" y="90" width="230" height="280" rx="10" fill="none" stroke="#16A34A" stroke-dasharray="6,4" stroke-width="2"/>
    <text x="135" y="78" class="badge" fill="#15803D">Contentor 1</text>

    <!-- Container 2 -->
    <rect x="285" y="100" width="230" height="260" rx="8" fill="#D3EFD6" stroke="#86EFAC" stroke-width="2"/>
    <text x="400" y="155" class="box-title" fill="#14532D">Aplicação B</text>
    <text x="400" y="188" class="box-sub" fill="#166534">Bibliotecas / Deps</text>
    <rect x="300" y="225" width="200" height="115" rx="6" fill="#BBF7D0" stroke="#86EFAC" stroke-width="1.5"/>
    <text x="400" y="270" class="box-sub" fill="#14532D" font-size="19px" font-weight="700">Sistema Ficheiros</text>
    <text x="400" y="300" class="box-sub" fill="#166534" font-size="16px">(ex: Debian rootfs)</text>
    <rect x="285" y="90" width="230" height="280" rx="10" fill="none" stroke="#16A34A" stroke-dasharray="6,4" stroke-width="2"/>
    <text x="400" y="78" class="badge" fill="#15803D">Contentor 2</text>

    <!-- Container 3 -->
    <rect x="550" y="100" width="230" height="260" rx="8" fill="#D3EFD6" stroke="#86EFAC" stroke-width="2"/>
    <text x="665" y="155" class="box-title" fill="#14532D">Aplicação C</text>
    <text x="665" y="188" class="box-sub" fill="#166534">Bibliotecas / Deps</text>
    <rect x="565" y="225" width="200" height="115" rx="6" fill="#BBF7D0" stroke="#86EFAC" stroke-width="1.5"/>
    <text x="665" y="270" class="box-sub" fill="#14532D" font-size="19px" font-weight="700">Sistema Ficheiros</text>
    <text x="665" y="300" class="box-sub" fill="#166534" font-size="16px">(ex: Ubuntu rootfs)</text>
    <rect x="550" y="90" width="230" height="280" rx="10" fill="none" stroke="#16A34A" stroke-dasharray="6,4" stroke-width="2"/>
    <text x="665" y="78" class="badge" fill="#15803D">Contentor 3</text>

    <!-- Container Engine -->
    <rect x="20" y="400" width="760" height="85" rx="10" fill="#E0F2FE" stroke="#38BDF8" stroke-width="2.5"/>
    <text x="400" y="438" class="box-title" fill="#0369A1" font-size="26px">MOTOR DE CONTENTORES (Docker Engine / containerd)</text>
    <text x="400" y="468" class="box-sub" fill="#0284C7" font-size="18px">Gestão de Ciclo de Vida, Imagens, Redes Virtuais e Armazenamento</text>

    <!-- Host Operating System -->
    <rect x="20" y="505" width="760" height="85" rx="10" fill="#CAD7EE" stroke="#93C5FD" stroke-width="2.5"/>
    <text x="400" y="543" class="box-title" fill="#1E3A8A" font-size="25px">KERNEL DO SISTEMA OPERATIVO ANFITRIÃO (LINUX)</text>
    <text x="400" y="572" class="box-sub" fill="#1E40AF" font-size="17px">Isolamento via Namespaces (PID, NET, MNT) &amp; Controlo de Recursos via cgroups</text>

    <!-- Host Hardware -->
    <rect x="20" y="610" width="760" height="220" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2.5"/>
    <text x="400" y="700" class="box-title" fill="#1E293B" font-size="30px">INFRAESTRUTURA FÍSICA (ANFITRIÃO / HOST)</text>
    <text x="400" y="745" class="box-sub" fill="#475569" font-size="20px">CPU (x86_64, ARM) · Memória RAM · Discos de Armazenamento · Placas de Rede</text>
  </g>
</svg>