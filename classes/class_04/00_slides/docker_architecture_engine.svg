<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1760 860" width="1760" height="860">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284C7"/>
    </marker>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 28px; font-weight: 700; fill: #0F172A; text-anchor: middle; }
      .box-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 22px; font-weight: 700; text-anchor: middle; }
      .sub { font-family: sans-serif; font-size: 14px; fill: #475569; text-anchor: middle; }
      .code { font-family: "Fira Code", monospace; font-size: 15px; font-weight: 700; text-anchor: middle; }
    </style>
  </defs>

  <rect width="1760" height="860" fill="#FFFFFF"/>

  <text x="880" y="50" class="title">Arquitetura Interna: Docker (Cliente-Servidor) vs. Podman (Sem Daemon / Rootless)</text>

  <!-- ==================== LEFT: DOCKER (Client-Server) ==================== -->
  <g transform="translate(80, 100)">
    <rect width="760" height="710" rx="14" fill="#F0F9FF" stroke="#38BDF8" stroke-width="2.5"/>
    <rect width="760" height="60" rx="14" fill="#E0F2FE"/>
    <text x="380" y="40" class="box-title" fill="#0369A1">Modelo Docker: Arquitetura Cliente-Servidor (Daemon)</text>

    <!-- CLI -->
    <rect x="180" y="90" width="400" height="75" rx="8" fill="#FFFFFF" stroke="#0284C7" stroke-width="2"/>
    <text x="380" y="125" class="box-title" fill="#0369A1" font-size="20px">Docker CLI (Cliente)</text>
    <text x="380" y="150" class="code" fill="#0284C7">docker run / docker compose</text>

    <line x1="380" y1="165" x2="380" y2="215" stroke="#0284C7" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="490" y="195" font-family="sans-serif" font-size="12px" fill="#0284C7" font-weight="700">REST API / Socket (/var/run/docker.sock)</text>

    <!-- Dockerd -->
    <rect x="180" y="225" width="400" height="90" rx="8" fill="#BAE6FD" stroke="#0284C7" stroke-width="2"/>
    <text x="380" y="260" class="box-title" fill="#0C4A6E" font-size="20px">Docker Daemon (dockerd)</text>
    <text x="380" y="290" class="sub" fill="#0369A1">Processo central sempre ativo em background (Root)</text>

    <line x1="380" y1="315" x2="380" y2="355" stroke="#0284C7" stroke-width="3" marker-end="url(#arrow)"/>

    <!-- containerd -->
    <rect x="180" y="365" width="400" height="80" rx="8" fill="#7DD3FC" stroke="#0369A1" stroke-width="2"/>
    <text x="380" y="400" class="box-title" fill="#0C4A6E" font-size="19px">containerd</text>
    <text x="380" y="425" class="sub" fill="#0369A1">Gestão de imagens e supervisão de contentores</text>

    <line x1="380" y1="445" x2="380" y2="485" stroke="#0284C7" stroke-width="3" marker-end="url(#arrow)"/>

    <!-- runc & kernel -->
    <rect x="180" y="495" width="400" height="75" rx="8" fill="#0284C7" stroke="#0369A1" stroke-width="2"/>
    <text x="380" y="530" class="box-title" fill="#FFFFFF" font-size="19px">runc (OCI Runtime)</text>
    <text x="380" y="555" class="sub" fill="#E0F2FE">Interage diretamente com o Kernel Linux</text>

    <rect x="80" y="605" width="600" height="80" rx="8" fill="#E0F2FE"/>
    <text x="380" y="635" font-family="sans-serif" font-size="14px" font-weight="700" fill="#0369A1" text-anchor="middle">
      Ponto Crítico: O Daemon corre tradicionalmente como root.
    </text>
    <text x="380" y="660" font-family="sans-serif" font-size="13px" fill="#0284C7" text-anchor="middle">
      Se o Daemon parar ou falhar, a gestão de todos os contentores é afetada.
    </text>
  </g>

  <!-- ==================== RIGHT: PODMAN (Daemonless) ==================== -->
  <g transform="translate(920, 100)">
    <rect width="760" height="710" rx="14" fill="#FAF5FF" stroke="#C084FC" stroke-width="2.5"/>
    <rect width="760" height="60" rx="14" fill="#F3E8FF"/>
    <text x="380" y="40" class="box-title" fill="#6B21A8">Modelo Podman: Sem Daemon (Daemonless &amp; Rootless)</text>

    <!-- Podman CLI -->
    <rect x="180" y="90" width="400" height="75" rx="8" fill="#FFFFFF" stroke="#9333EA" stroke-width="2"/>
    <text x="380" y="125" class="box-title" fill="#6B21A8" font-size="20px">Podman CLI</text>
    <text x="380" y="150" class="code" fill="#7E22CE">podman run / podman compose</text>

    <line x1="380" y1="165" x2="380" y2="280" stroke="#9333EA" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="230" y="200" width="300" height="45" rx="6" fill="#F3E8FF"/>
    <text x="380" y="228" font-family="sans-serif" font-size="13px" font-weight="700" fill="#6B21A8" text-anchor="middle">SEM DAEMON CENTRAL!</text>

    <!-- conmon -->
    <rect x="180" y="295" width="400" height="80" rx="8" fill="#E9D5FF" stroke="#9333EA" stroke-width="2"/>
    <text x="380" y="330" class="box-title" fill="#581C87" font-size="19px">conmon (Container Monitor)</text>
    <text x="380" y="355" class="sub" fill="#6B21A8">Um processo leve de monitorização por contentor</text>

    <line x1="380" y1="375" x2="380" y2="485" stroke="#9333EA" stroke-width="3" marker-end="url(#arrow)"/>

    <!-- runc & kernel -->
    <rect x="180" y="495" width="400" height="75" rx="8" fill="#9333EA" stroke="#6B21A8" stroke-width="2"/>
    <text x="380" y="530" class="box-title" fill="#FFFFFF" font-size="19px">runc / crun (OCI Runtime)</text>
    <text x="380" y="555" class="sub" fill="#F3E8FF">Interage com o Kernel usando User Namespaces</text>

    <rect x="80" y="605" width="600" height="80" rx="8" fill="#F3E8FF"/>
    <text x="380" y="635" font-family="sans-serif" font-size="14px" font-weight="700" fill="#6B21A8" text-anchor="middle">
      Vantagem de Segurança: Execução Rootless por omissão.
    </text>
    <text x="380" y="660" font-family="sans-serif" font-size="13px" fill="#7E22CE" text-anchor="middle">
      Um utilizador comum cria e gere contentores sem permissões de administrador (sudo)!
    </text>
  </g>
</svg>