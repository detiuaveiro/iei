<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1760 900" width="1760" height="900">
  <defs>
    <style>
      .box-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 26px; font-weight: 700; text-anchor: middle; }
      .layer-text { font-family: "Fira Code", monospace; font-size: 18.5px; font-weight: 600; text-anchor: middle; }
      .layer-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 15px; text-anchor: middle; }
      .conclusion-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 21px; text-anchor: middle; }
    </style>
  </defs>

  <rect width="1760" height="900" fill="#FFFFFF"/>

  <!-- ==================== LEFT: CONTAINER A ==================== -->
  <g transform="translate(120, 25)">
    <text x="340" y="30" class="box-title" fill="#15803D">Contentor A (ex: Webserver 1)</text>

    <!-- RW Layer Container A -->
    <rect x="0" y="50" width="680" height="85" rx="8" fill="#DCFCE7" stroke="#22C55E" stroke-width="2.5"/>
    <text x="300" y="85" class="layer-text" fill="#14532D">CAMADA DE ESCRITA (R/W)</text>
    <text x="300" y="114" class="layer-sub" fill="#166534">Modificações locais · Ficheiros temporários · Logs</text>
    <rect x="550" y="60" width="112" height="30" rx="15" fill="#BBF7D0" stroke="#86EFAC" stroke-width="1"/>
    <text x="606" y="80" font-family="sans-serif" font-size="13.5px" font-weight="800" fill="#15803D" text-anchor="middle">EFÉMERO</text>

    <!-- RO Layers (Shared) -->
    <g transform="translate(0, 155)">
      <!-- Layer 4 -->
      <rect x="0" y="0" width="680" height="70" rx="6" fill="#BAE6FD" stroke="#38BDF8" stroke-width="2"/>
      <text x="340" y="42" class="layer-text" fill="#0C4A6E">Layer 4: COPY ./html /usr/share/nginx/html [R/O]</text>

      <!-- Layer 3 -->
      <rect x="0" y="80" width="680" height="70" rx="6" fill="#7DD3FC" stroke="#0284C7" stroke-width="2"/>
      <text x="340" y="122" class="layer-text" fill="#0C4A6E">Layer 3: RUN apt-get install -y nginx [R/O]</text>

      <!-- Layer 2 -->
      <rect x="0" y="160" width="680" height="70" rx="6" fill="#38BDF8" stroke="#0284C7" stroke-width="2"/>
      <text x="340" y="202" class="layer-text" fill="#FFFFFF">Layer 2: ENV PORT=80 [R/O]</text>

      <!-- Layer 1 -->
      <rect x="0" y="240" width="680" height="90" rx="6" fill="#0284C7" stroke="#0369A1" stroke-width="2"/>
      <text x="340" y="280" class="layer-text" fill="#FFFFFF">Layer 1: Base alpine:3.20 (rootfs) [R/O]</text>
      <text x="340" y="308" class="layer-sub" fill="#E0F2FE">Sistema de Ficheiros Base (bin, etc, lib, usr)</text>
    </g>
  </g>

  <!-- ==================== RIGHT: CONTAINER B ==================== -->
  <g transform="translate(960, 25)">
    <text x="340" y="30" class="box-title" fill="#15803D">Contentor B (ex: Webserver 2)</text>

    <!-- RW Layer Container B -->
    <rect x="0" y="50" width="680" height="85" rx="8" fill="#DCFCE7" stroke="#22C55E" stroke-width="2.5"/>
    <text x="300" y="85" class="layer-text" fill="#14532D">CAMADA DE ESCRITA (R/W)</text>
    <text x="300" y="114" class="layer-sub" fill="#166534">Modificações locais independentes do Contentor A</text>
    <rect x="550" y="60" width="112" height="30" rx="15" fill="#BBF7D0" stroke="#86EFAC" stroke-width="1"/>
    <text x="606" y="80" font-family="sans-serif" font-size="13.5px" font-weight="800" fill="#15803D" text-anchor="middle">EFÉMERO</text>

    <!-- RO Layers (Shared) -->
    <g transform="translate(0, 155)">
      <!-- Layer 4 -->
      <rect x="0" y="0" width="680" height="70" rx="6" fill="#BAE6FD" stroke="#38BDF8" stroke-width="2"/>
      <text x="340" y="42" class="layer-text" fill="#0C4A6E">Layer 4: COPY ./html /usr/share/nginx/html [R/O]</text>

      <!-- Layer 3 -->
      <rect x="0" y="80" width="680" height="70" rx="6" fill="#7DD3FC" stroke="#0284C7" stroke-width="2"/>
      <text x="340" y="122" class="layer-text" fill="#0C4A6E">Layer 3: RUN apt-get install -y nginx [R/O]</text>

      <!-- Layer 2 -->
      <rect x="0" y="160" width="680" height="70" rx="6" fill="#38BDF8" stroke="#0284C7" stroke-width="2"/>
      <text x="340" y="202" class="layer-text" fill="#FFFFFF">Layer 2: ENV PORT=80 [R/O]</text>

      <!-- Layer 1 -->
      <rect x="0" y="240" width="680" height="90" rx="6" fill="#0284C7" stroke="#0369A1" stroke-width="2"/>
      <text x="340" y="280" class="layer-text" fill="#FFFFFF">Layer 1: Base alpine:3.20 (rootfs) [R/O]</text>
      <text x="340" y="308" class="layer-sub" fill="#E0F2FE">Sistema de Ficheiros Base (bin, etc, lib, usr)</text>
    </g>
  </g>

  <!-- ==================== BOTTOM: SHARED IMAGE & CONCLUSIONS ==================== -->
  <rect x="100" y="535" width="1560" height="330" rx="14" fill="#F8FAFC" stroke="#0284C7" stroke-width="2.5" stroke-dasharray="10,5"/>
  <text x="880" y="578" font-family="sans-serif" font-size="27px" font-weight="800" fill="#0369A1" text-anchor="middle">IMAGEM DOCKER (Partilhada no Disco)</text>

  <!-- Row 1: Shared RO Layers -->
  <rect x="135" y="600" width="1490" height="64" rx="8" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.5"/>
  <text x="880" y="640" font-family="sans-serif" font-size="22px" font-weight="700" fill="#1D4ED8" text-anchor="middle">
    Partilha e Imutabilidade: <tspan font-weight="500" fill="#1E293B">As 4 camadas da imagem são estáticas, imutáveis e 100% partilhadas em disco em modo apenas de leitura (R/O).</tspan>
  </text>

  <!-- Row 2: Copy-on-Write Mechanism -->
  <rect x="135" y="676" width="1490" height="64" rx="8" fill="#F0FDFA" stroke="#99F6E4" stroke-width="1.5"/>
  <text x="880" y="716" font-family="sans-serif" font-size="22px" font-weight="700" fill="#0F766E" text-anchor="middle">
    Mecanismo Copy-on-Write (CoW): <tspan font-weight="500" fill="#1E293B">Ao alterar um ficheiro existente, o Docker copia-o para a camada R/W sem modificar a imagem base!</tspan>
  </text>

  <!-- Row 3: Ephemeral RW Layer Warning -->
  <rect x="135" y="752" width="1490" height="64" rx="8" fill="#FEF2F2" stroke="#FECACA" stroke-width="1.5"/>
  <text x="880" y="792" font-family="sans-serif" font-size="22px" font-weight="700" fill="#DC2626" text-anchor="middle">
    Atenção à Volatilidade: <tspan font-weight="600" fill="#991B1B">Ao remover o contentor (docker rm / docker compose down), a camada R/W é destruída permanentemente.</tspan>
  </text>
</svg>