<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 860" width="1800" height="860">
  <defs>
    <style>
      .title { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 34px; font-weight: 800; fill: #0F172A; text-anchor: middle; }
      .box-title { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 26px; font-weight: 700; text-anchor: middle; }
      .lbl { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 23px; font-weight: 700; text-anchor: middle; }
      .code { font-family: "Fira Code", Menlo, monospace; font-size: 23px; font-weight: 700; text-anchor: middle; }
      .note { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 22px; font-weight: 600; text-anchor: middle; }
      .note-warn { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 22px; font-weight: 700; text-anchor: middle; }
      .note-sub { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 20px; font-weight: 600; text-anchor: middle; }
      .step { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 34px; font-weight: 900; fill: #FFFFFF; text-anchor: middle; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16A34A"/>
    </marker>
  </defs>

  <rect width="1800" height="860" fill="#FFFFFF"/>

  <!-- LEFT: shared libraries -->
  <g transform="translate(50, 20)">
    <text x="400" y="45" class="title">Modelo Tradicional: Bibliotecas Partilhadas</text>

    <!-- App A -->
    <rect x="40" y="85" width="330" height="135" rx="12" fill="#DCFCE7" stroke="#16A34A" stroke-width="2.5"/>
    <text x="205" y="138" class="box-title" fill="#14532D">Aplicação A</text>
    <text x="205" y="178" class="code" fill="#166534">requer libXYZ 1.0</text>

    <!-- App B -->
    <rect x="430" y="85" width="330" height="135" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.5"/>
    <text x="595" y="138" class="box-title" fill="#1E3A8A">Aplicação B</text>
    <text x="595" y="178" class="code" fill="#1D4ED8">requer libXYZ 2.0</text>

    <!-- Connectors -->
    <line x1="205" y1="222" x2="310" y2="375" stroke="#DC2626" stroke-width="3.5" stroke-dasharray="8,6" marker-end="url(#arrow-red)"/>
    <line x1="595" y1="222" x2="490" y2="375" stroke="#475569" stroke-width="3.5" marker-end="url(#arrow)"/>

    <!-- /usr/lib container -->
    <rect x="40" y="380" width="720" height="200" rx="14" fill="#F8FAFC" stroke="#64748B" stroke-width="2.5"/>
    <text x="400" y="425" class="box-title" fill="#0F172A">/usr/lib (gerido por apt / dnf)</text>
    <rect x="230" y="445" width="340" height="65" rx="10" fill="#FFFFFF" stroke="#475569" stroke-width="2"/>
    <text x="400" y="487" class="code" fill="#0F172A" font-size="24px">libXYZ.so.2.0</text>
    <text x="400" y="550" class="note-warn" fill="#B91C1C">A instalação de B substituiu a versão 1.0 no sistema!</text>

    <!-- Big X icon -->
    <circle cx="160" cy="300" r="32" fill="#DC2626"/>
    <text x="160" y="312" class="step">X</text>

    <!-- Consequence box -->
    <rect x="40" y="610" width="720" height="205" rx="14" fill="#FEF2F2" stroke="#EF4444" stroke-width="2.5"/>
    <text x="400" y="652" class="box-title" fill="#991B1B">Consequência: Conflito de Versões</text>
    <text x="400" y="698" class="note" fill="#7F1D1D">Aplicação A deixa de funcionar (símbolos em falta / ABI incompatível)</text>
    <text x="400" y="738" class="note" fill="#7F1D1D">Exige compilação e empacotamento dedicado por distribuição</text>
    <text x="400" y="776" class="note-sub" fill="#991B1B">(Debian, Ubuntu, Fedora, Arch Linux, ...)</text>
  </g>

  <!-- Vertical separator -->
  <line x1="900" y1="30" x2="900" y2="825" stroke="#CBD5E1" stroke-width="3" stroke-dasharray="10,6"/>

  <!-- RIGHT: encapsulated -->
  <g transform="translate(950, 20)">
    <text x="400" y="45" class="title">Modelo Contentorizado: Dependências Encapsuladas</text>

    <!-- Package / Sandbox A -->
    <rect x="40" y="85" width="340" height="315" rx="14" fill="#F0FDF4" stroke="#16A34A" stroke-width="2.5" stroke-dasharray="8,6"/>
    <text x="210" y="120" class="lbl" fill="#15803D">Pacote / Sandbox A</text>
    <rect x="65" y="140" width="290" height="95" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
    <text x="210" y="197" class="box-title" fill="#14532D">Aplicação A</text>
    <rect x="65" y="255" width="290" height="95" rx="10" fill="#FFFFFF" stroke="#16A34A" stroke-width="2"/>
    <text x="210" y="312" class="code" fill="#166534" font-size="23px">libXYZ.so.1.0</text>

    <!-- Package / Sandbox B -->
    <rect x="420" y="85" width="340" height="315" rx="14" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.5" stroke-dasharray="8,6"/>
    <text x="590" y="120" class="lbl" fill="#1D4ED8">Pacote / Sandbox B</text>
    <rect x="445" y="140" width="290" height="95" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <text x="590" y="197" class="box-title" fill="#1E3A8A">Aplicação B</text>
    <rect x="445" y="255" width="290" height="95" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
    <text x="590" y="312" class="code" fill="#1D4ED8" font-size="23px">libXYZ.so.2.0</text>

    <!-- Connectors -->
    <line x1="210" y1="402" x2="210" y2="470" stroke="#16A34A" stroke-width="3.5" marker-end="url(#arrow-green)"/>
    <line x1="590" y1="402" x2="590" y2="470" stroke="#16A34A" stroke-width="3.5" marker-end="url(#arrow-green)"/>

    <!-- Host Linux Kernel -->
    <rect x="40" y="475" width="720" height="110" rx="14" fill="#F8FAFC" stroke="#64748B" stroke-width="2.5"/>
    <text x="400" y="520" class="box-title" fill="#0F172A">Kernel Linux do Anfitrião (partilhado)</text>
    <text x="400" y="560" class="note" fill="#334155">namespaces · cgroups · isolamento de processos (Aula 04)</text>

    <!-- Result Box -->
    <rect x="40" y="610" width="720" height="205" rx="14" fill="#F0FDF4" stroke="#22C55E" stroke-width="2.5"/>
    <text x="400" y="652" class="box-title" fill="#15803D">Resultado: Coexistência e Portabilidade</text>
    <text x="400" y="698" class="note" fill="#14532D">As duas versões de bibliotecas coexistem sem qualquer conflito</text>
    <text x="400" y="738" class="note" fill="#14532D">O mesmo pacote executa em qualquer distribuição Linux moderna</text>
    <text x="400" y="776" class="note-sub" fill="#15803D">(Flatpak, AppImage, Snap)</text>
  </g>
</svg>