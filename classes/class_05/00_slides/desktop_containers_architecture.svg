<rect x="25" y="370" width="360" height="130" rx="10" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.8"/>
<text x="205" y="402" class="lbl" fill="#14532D" font-size="20px" font-weight="700" letter-spacing="1">MOTOR DE EXECUÇÃO</text>
<text x="205" y="440" class="box-title" fill="#14532D" font-size="23px">bubblewrap (bwrap)</text>
