<text x="205" y="34" class="box-title" fill="#FFFFFF" font-size="28px">Docker / OCI</text>
<text x="205" y="60" class="box-sub" fill="#FFFFFF" font-size="20px">Aula 04 · Serviços de servidor</text>
<rect x="25" y="90" width="360" height="130" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.8"/>
<text x="205" y="122" class="lbl" fill="#1E3A8A" font-size="20px" font-weight="700" letter-spacing="1">UNIDADE ISOLADA</text>
<text x="205" y="160" class="box-title" fill="#1E3A8A" font-size="23px">Serviço headless</text>
<text x="205" y="194" class="note" font-size="20px">API, base de dados, servidor web</text>
