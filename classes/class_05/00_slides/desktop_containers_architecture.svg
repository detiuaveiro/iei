<rect x="25" y="90" width="360" height="130" rx="10" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.8"/>
<text x="205" y="122" class="lbl" fill="#14532D" font-size="20px" font-weight="700" letter-spacing="1">UNIDADE ISOLADA</text>
<text x="205" y="160" class="box-title" fill="#14532D" font-size="23px">Aplicação gráfica</text>
<text x="205" y="194" class="note" font-size="20px">GUI, áudio, GPU, Wayland / X11</text>
<rect x="25" y="230" width="360" height="130" rx="10" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.8"/>
<text x="205" y="262" class="lbl" fill="#14532D" font-size="20px" font-weight="700" letter-spacing="1">DEPENDÊNCIAS</text>
<text x="205" y="300" class="box-title" fill="#14532D" font-size="23px">Runtime partilhado</text>
