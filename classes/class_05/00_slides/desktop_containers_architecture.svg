<text x="205" y="402" class="lbl" fill="#1E3A8A" font-size="20px" font-weight="700" letter-spacing="1">MOTOR DE EXECUÇÃO</text>
<text x="205" y="440" class="box-title" fill="#1E3A8A" font-size="23px">dockerd + containerd + runc</text>
<text x="205" y="474" class="note" font-size="20px">Daemon com privilégios root</text>
<rect x="25" y="510" width="360" height="130" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.8"/>
<text x="205" y="542" class="lbl" fill="#1E3A8A" font-size="20px" font-weight="700" letter-spacing="1">ISOLAMENTO</text>
