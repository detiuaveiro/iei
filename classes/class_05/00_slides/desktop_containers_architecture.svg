<text x="205" y="402" class="lbl" fill="#7C2D12" font-size="20px" font-weight="700" letter-spacing="1">MOTOR DE EXECUÇÃO</text>
<text x="205" y="440" class="box-title" fill="#7C2D12" font-size="23px">Montagem FUSE + AppRun</text>
